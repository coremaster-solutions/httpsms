services:
  postgres:
    image: postgres:alpine
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_USER: dbusername
    volumes:
      - postgres:/var/lib/postgresql/data
    # No publicar Postgres al host en Dokploy (solo red interna)
    expose:
      - "5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 5s

  redis:
    image: redis:latest
    command: redis-server
    volumes:
      - redis:/var/lib/redis
    expose:
      - "6379"
    restart: on-failure

  api:
    build:
      context: ./api
    # Dokploy: un solo Environment del compose → archivo .env en la raíz del proyecto
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  web:
    build:
      context: ./web
      # Nuxt se genera en build: estas vars deben existir en el Environment de Dokploy
      args:
        API_BASE_URL: ${API_BASE_URL}
        APP_URL: ${APP_URL}
        APP_NAME: ${APP_NAME:-httpSMS}
        APP_GITHUB_URL: ${APP_GITHUB_URL:-https://github.com/NdoleStudio/httpsms}
        APP_DOCUMENTATION_URL: ${APP_DOCUMENTATION_URL:-https://docs.httpsms.com}
        APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
        APP_ENV: ${APP_ENV:-production}
        CLOUDFLARE_TURNSTILE_SITE_KEY: ${CLOUDFLARE_TURNSTILE_SITE_KEY:-}
        PUSHER_KEY: ${PUSHER_KEY:-}
        PUSHER_CLUSTER: ${PUSHER_CLUSTER:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
        FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID}
        FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: on-failure

volumes:
  redis:
  postgres:
